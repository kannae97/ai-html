<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4eb" />
    <title>今天，顺风。｜鹈鹕的海岸骑行</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f7f4eb;
        --ink: #294d49;
        --muted: #7b8b7e;
        --orange: #d86f46;
        --line: #dce0d1;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background: var(--paper);
        color: var(--ink);
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      button { font: inherit; }
      button:focus-visible {
        outline: 3px solid #d86f4680;
        outline-offset: 5px;
      }
      button:disabled { cursor: default; opacity: 0.55; }
      ::selection { background: #edb992; color: var(--ink); }

      .page {
        width: min(100% - 96px, 1240px);
        margin: 0 auto;
        padding: 30px 0 24px;
      }

      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
      }

      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-mark { width: 42px; height: 42px; }
      .brand-name {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .brand-subtitle {
        margin-top: 4px;
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 3px;
      }
      .edition {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 1.5px;
      }
      .edition-line { width: 30px; height: 1px; background: #b8c5b8; }

      .intro {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        padding: 32px 0 27px;
      }
      .eyebrow {
        margin: 0 0 10px;
        color: var(--orange);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 3px;
      }
      h1 {
        margin: 0;
        font-family: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
        font-size: clamp(40px, 5vw, 65px);
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -2px;
      }
      h1 span { color: var(--orange); }
      .intro-copy {
        margin: 0 2px 4px 0;
        color: #778576;
        font-size: 12px;
        line-height: 2;
        letter-spacing: 1px;
      }

      .postcard {
        overflow: hidden;
        border: 1px solid #d7dfd0;
        border-radius: 21px;
        background: #fdfbf4;
        box-shadow: 0 12px 36px #3f66570a, 0 2px 5px #3f665704;
      }
      .stage {
        position: relative;
        overflow: hidden;
        aspect-ratio: 1280 / 660;
        background: #dbece2;
      }
      .landscape { display: block; width: 100%; height: 100%; }
      .scene-note {
        position: absolute;
        top: 28px;
        left: 30px;
        pointer-events: none;
      }
      .scene-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        color: #5c7d70;
        font-size: 9px;
        letter-spacing: 2px;
      }
      .scene-label::before {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #d98555;
        content: "";
      }
      .scene-description {
        margin: 9px 0 0;
        color: #728c7c;
        font-size: 11px;
        letter-spacing: 1px;
      }
      .postmark {
        position: absolute;
        top: 20px;
        right: 25px;
        width: 82px;
        height: 82px;
        color: #6e9380;
        opacity: 0.7;
        transform: rotate(12deg);
        pointer-events: none;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 22px;
        padding: 19px 27px;
        border-top: 1px solid #d9dfcb;
      }
      .ride-info { display: flex; align-items: center; gap: 12px; min-width: 160px; }
      .weather-icon { width: 29px; height: 29px; color: #c89652; }
      .ride-status { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 1px; }
      .ride-subtitle { margin: 5px 0 0; color: #8b9586; font-size: 10px; letter-spacing: 1px; }
      .speed-control { display: flex; align-items: center; gap: 15px; }
      .speed-label { color: #87917f; font-size: 10px; letter-spacing: 1px; }
      .speed-options {
        display: flex;
        gap: 3px;
        padding: 4px;
        border: 1px solid #e4e6d9;
        border-radius: 99px;
        background: #f2f3e9;
      }
      .speed-option {
        padding: 8px 13px;
        border: 0;
        border-radius: 99px;
        background: transparent;
        color: #8a9585;
        cursor: pointer;
        font-size: 11px;
        white-space: nowrap;
        transition: background 160ms, color 160ms, box-shadow 160ms;
      }
      .speed-option[aria-pressed="true"] {
        background: #fffdf7;
        color: #375c50;
        box-shadow: 0 1px 5px #3c554212;
      }
      .speed-option:hover { color: #315346; }
      .playback {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .speed-readout {
        min-width: 54px;
        color: #71816e;
        font-family: Georgia, serif;
        font-size: 22px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .speed-readout small {
        margin-left: 3px;
        font-family: system-ui, sans-serif;
        font-size: 8px;
        letter-spacing: 0.5px;
      }
      .pause-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-width: 115px;
        padding: 12px 16px;
        border: 1px solid #345b4c;
        border-radius: 99px;
        background: #345b4c;
        color: #fffdf1;
        cursor: pointer;
        font-size: 11px;
        letter-spacing: 1px;
        transition: background 160ms, transform 160ms;
      }
      .pause-button:hover { background: #264a3d; transform: translateY(-1px); }
      .pause-button svg { width: 13px; height: 13px; }
      .pause-button[data-state="playing"] .play-icon,
      .pause-button[data-state="paused"] .pause-icon { display: none; }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        margin-top: 22px;
        color: #99a08f;
        font-size: 10px;
        letter-spacing: 1.5px;
      }
      .footer-message { display: flex; align-items: center; gap: 8px; }
      .footer-message svg { width: 14px; height: 14px; }
      .footer-credit { font-family: Georgia, serif; font-style: italic; letter-spacing: 0.6px; }
      .noscript { margin: 16px 0 0; color: #8e694c; font-size: 12px; text-align: center; }

      @media (min-width: 1500px) {
        .page { padding-top: 42px; }
        .intro { padding-top: 39px; padding-bottom: 34px; }
      }
      @media (max-width: 900px) {
        .page { width: calc(100% - 48px); padding-top: 24px; }
        .toolbar { flex-wrap: wrap; gap: 17px; padding: 17px 20px; }
        .ride-info { flex: 1; }
        .speed-control { order: 3; justify-content: center; width: 100%; }
        .speed-label { margin-right: 5px; }
        .intro-copy { font-size: 11px; }
      }
      @media (max-width: 560px) {
        .page { width: calc(100% - 32px); padding: 19px 0 22px; }
        .masthead { padding-bottom: 17px; }
        .brand-mark { width: 35px; height: 35px; }
        .brand-name { font-size: 17px; }
        .brand-subtitle { font-size: 8px; letter-spacing: 2px; }
        .edition { font-size: 8px; letter-spacing: 0.8px; }
        .edition-line { display: none; }
        .intro { display: block; padding: 27px 0 23px; }
        h1 { font-size: 47px; }
        .eyebrow { font-size: 8px; margin-bottom: 10px; }
        .intro-copy { margin: 14px 0 0; line-height: 1.8; }
        .intro-copy br { display: none; }
        .postcard { border-radius: 16px; }
        .stage { aspect-ratio: 1.08; }
        .scene-note { top: 20px; left: 19px; }
        .scene-label { font-size: 8px; letter-spacing: 1.2px; }
        .scene-description { font-size: 9px; }
        .postmark { width: 60px; height: 60px; top: 16px; right: 12px; }
        .toolbar { gap: 18px; padding: 16px; }
        .ride-info { gap: 8px; min-width: 135px; }
        .weather-icon { width: 23px; height: 23px; }
        .ride-status { font-size: 11px; }
        .ride-subtitle { font-size: 8px; }
        .playback { gap: 10px; }
        .speed-readout { min-width: 43px; font-size: 19px; }
        .pause-button { min-width: 94px; padding: 11px 12px; font-size: 10px; gap: 7px; }
        .speed-control { gap: 8px; }
        .speed-option { padding: 8px 15px; font-size: 10px; }
        .footer { margin-top: 17px; font-size: 8px; letter-spacing: 0.6px; }
        .footer-credit { font-size: 9px; }
      }
      @media (max-width: 370px) {
        .speed-readout { display: none; }
        .speed-option { padding-inline: 12px; }
        .edition { font-size: 7px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <rect x="1" y="1" width="46" height="46" rx="15" fill="#e8eddd" />
            <path d="M14 32C9 27 12 20 19 20H24V15C24 10 32 10 32 16V23C32 31 24 36 17 33" fill="#fffdf1" stroke="#3b6050" stroke-width="1.5" />
            <path d="M31 17L43 20L31 23Z" fill="#e9aa55" stroke="#c58b42" stroke-width="1" />
            <circle cx="29.5" cy="15.5" r="1.25" fill="#345649" />
            <path d="M16 26C20 26 22 28 25 26M18 34L16 39M23 34L25 39" stroke="#3b6050" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <div>
            <div class="brand-name">Pelican Club</div>
            <div class="brand-subtitle">慢一点，也没关系</div>
          </div>
        </div>
        <div class="edition"><span class="edition-line"></span>海岸骑行手记 / 001</div>
      </header>

      <main>
        <div class="intro">
          <div>
            <p class="eyebrow">LESS HURRY. MORE BREEZE.</p>
            <h1>今天，<span>顺风。</span></h1>
          </div>
          <p class="intro-copy">沿着海岸线，踩掉一点烦恼。<br />别着急，下一站是好心情。</p>
        </div>

        <section class="postcard" aria-label="鹈鹕的海岸骑行">
          <div class="stage">
            <svg class="landscape" viewBox="0 0 1280 660" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="scene-title scene-desc">
              <title id="scene-title">一只骑着自行车去海边的鹈鹕</title>
              <desc id="scene-desc">白色鹈鹕戴着绿色骑行帽，系着橙色围巾，在海岸公路上踩着橙色自行车。车篮里装着鲜花与面包，身后是缓缓移动的云朵、碧绿的海面和远处的灯塔。</desc>
              <defs>
                <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                  <stop stop-color="#dcebe1" />
                  <stop offset="1" stop-color="#f2eed5" />
                </linearGradient>
                <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
                  <stop stop-color="#8dbdb1" />
                  <stop offset="1" stop-color="#b1d3bc" />
                </linearGradient>
                <linearGradient id="sand" x1="0" y1="0" x2="0.6" y2="1">
                  <stop stop-color="#f1dfb7" />
                  <stop offset="1" stop-color="#edcea2" />
                </linearGradient>
                <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
                  <stop stop-color="#f5c66f" />
                  <stop offset="1" stop-color="#e5a54f" />
                </linearGradient>
                <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
                  <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" stitchTiles="stitch" />
                  <feColorMatrix type="saturate" values="0" />
                  <feComponentTransfer><feFuncA type="linear" slope="0.09" /></feComponentTransfer>
                  <feBlend in="SourceGraphic" mode="multiply" />
                </filter>
                <g id="cloud-shape">
                  <path d="M-66 13C-88 10-86-13-65-18C-62-43-26-46-14-23C5-43 37-31 37-9C64-17 81 7 62 15Z" fill="#fffbee" />
                </g>
                <g id="spokes" stroke="#eee9ce" stroke-width="1.5">
                  <path d="M0-67V67M-67 0H67M-58-33.5L58 33.5M-58 33.5L58-33.5M-33.5-58L33.5 58M-33.5 58L33.5-58" />
                  <rect x="-3" y="-62" width="6" height="16" rx="2" fill="#e8aa67" stroke="none" />
                </g>
                <g id="grass" fill="none" stroke="#92a276" stroke-width="2.5" stroke-linecap="round">
                  <path d="M0 0Q-1-17-11-24M0 0Q2-23 10-33M0 0Q-6-10-17-12M1-1Q9-14 17-17" />
                  <path d="M8-26L13-31M-8-18L-13-23" stroke="#b7b382" stroke-width="4" />
                </g>
                <g id="flower">
                  <g fill="#fff9df">
                    <ellipse cy="-7" rx="4" ry="7" />
                    <ellipse cy="-7" rx="4" ry="7" transform="rotate(60)" />
                    <ellipse cy="-7" rx="4" ry="7" transform="rotate(120)" />
                    <ellipse cy="-7" rx="4" ry="7" transform="rotate(180)" />
                    <ellipse cy="-7" rx="4" ry="7" transform="rotate(240)" />
                    <ellipse cy="-7" rx="4" ry="7" transform="rotate(300)" />
                  </g>
                  <circle r="4.5" fill="#dfaa4c" />
                </g>
                <path id="stamp-circle" d="M40 11A29 29 0 1 1 39.9 11" />
              </defs>

              <!-- A quiet coast, arranged in layers for parallax. -->
              <path fill="url(#sky)" d="M0 0H1280V660H0Z" />
              <circle cx="1001" cy="142" r="79" fill="#f8edcb" opacity="0.45" />
              <circle cx="1001" cy="142" r="56" fill="#fcf1cf" />
              <circle cx="1001" cy="142" r="66" fill="none" stroke="#fff8df" opacity="0.5" />
              <g id="cloud-one" transform="translate(206 131)" opacity="0.7"><use href="#cloud-shape" /></g>
              <g id="cloud-two" transform="translate(548 91) scale(.72)" opacity="0.62"><use href="#cloud-shape" /></g>
              <g id="cloud-three" transform="translate(1156 210) scale(.9)" opacity="0.58"><use href="#cloud-shape" /></g>
              <g id="gulls" fill="none" stroke="#849e8b" stroke-width="2" stroke-linecap="round" opacity="0.7">
                <path id="gull-one" d="M817 138Q828 126 839 138Q850 125 861 137" />
                <path id="gull-two" d="M867 170Q874 162 881 170Q888 161 895 169" />
              </g>

              <path d="M0 312Q86 291 164 308T328 313Q411 298 468 317H1280V476H0Z" fill="url(#sea)" />
              <path d="M0 315H1280" fill="none" stroke="#afcbbb" stroke-width="2" />
              <g opacity="0.72">
                <path d="M856 315Q896 281 950 286Q998 262 1041 281Q1115 238 1172 269Q1234 271 1280 296V322Z" fill="#9dbba1" />
                <path d="M960 313Q1033 285 1092 294Q1164 271 1249 305L1280 322H916Z" fill="#87a88c" />

                <path d="M1097 205V193H1123V205Z" fill="#e9e8cb" stroke="#729584" stroke-width="2" />
                <path d="M1092 193L1110 180L1128 193Z" fill="#b9795a" />

                <path d="M1107 259A4 4 0 0 1 1115 259V276H1107Z" fill="#789583" />
                <path d="M1085 278H1135" stroke="#7e9e86" stroke-width="3" stroke-linecap="round" />
              </g>
              <g id="sea-ripples" fill="none" stroke="#e1e9cc" stroke-linecap="round" opacity="0.6">
                <path d="M-100 345H-53M73 367H147M270 341H299M416 378H476M600 346H635M763 366H832M960 343H1016M1115 378H1186M1325 346H1370M1480 366H1549" stroke-width="2" />

              </g>
              <g id="sailboat" transform="translate(0 0)">

              </g>

              <path d="M0 461Q130 440 261 465T526 469Q670 445 815 467T1100 465Q1213 446 1280 460V660H0Z" fill="#e6e0b6" />
              <path d="M0 489Q155 468 320 490T618 489Q760 472 896 493T1182 486L1280 488V660H0Z" fill="#d1cea2" />

              <path d="M0 532Q278 525 530 532T1035 532L1280 532" fill="none" stroke="#f8e8c7" stroke-width="3" />
              <path d="M0 640H1280" stroke="#f9e7c3" stroke-width="3" />
              <g id="road-markings" stroke="#fcf0cf" stroke-width="5" stroke-linecap="round" opacity="0.9">
                <path d="M-300 606H-195M20 606H125M340 606H445M660 606H765M980 606H1085M1300 606H1405M1620 606H1725" />
              </g>
              <g id="roadside">
                <use href="#grass" x="164" y="529" />
                <use href="#grass" x="1000" y="526" transform="rotate(-6 1000 526)" />
                <use href="#grass" x="1844" y="529" />
                <use href="#grass" x="2680" y="526" transform="rotate(-6 2680 526)" />
                <g fill="none" stroke="#a8ad7e" stroke-width="2" stroke-linecap="round">
                  <path d="M283 520L290 510M297 520L298 515M1144 518L1149 510M1963 520L1970 510M1977 520L1978 515M2824 518L2829 510" />
                </g>
                <g id="direction-sign">
                  <path d="M1125 448V521" stroke="#8f9c78" stroke-width="5" stroke-linecap="round" />
                  <path d="M1078 437H1159L1175 452L1159 467H1078Z" fill="#719781" />
                  <path d="M1084 443H1156L1166 452L1156 461H1084Z" fill="none" stroke="#aac0a0" />
                  <text x="1120" y="456" fill="#f4f0d5" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="3">去海边</text>
                </g>
                <use href="#direction-sign" x="1680" />
              </g>

              <!-- The wheels stay on the ground while their spokes turn. -->
              <ellipse cx="627" cy="568" rx="244" ry="12" fill="#9b986b" opacity="0.16" />
              <g id="bicycle" stroke-linecap="round" stroke-linejoin="round">
                <g fill="none">
                  <circle cx="477" cy="486" r="75" stroke="#385951" stroke-width="9" />
                  <circle cx="781" cy="486" r="75" stroke="#385951" stroke-width="9" />
                  <circle cx="477" cy="486" r="68.5" stroke="#f6ebca" stroke-width="2" />
                  <circle cx="781" cy="486" r="68.5" stroke="#f6ebca" stroke-width="2" />
                </g>
                <g id="rear-wheel-spin" transform="translate(477 486)"><use href="#spokes" /></g>
                <g id="front-wheel-spin" transform="translate(781 486)"><use href="#spokes" /></g>
                <g fill="#d8ad6b" stroke="#3c5b50" stroke-width="2.5">
                  <circle cx="477" cy="486" r="6" />
                  <circle cx="781" cy="486" r="6" />
                </g>
                <path d="M396 478A81 81 0 0 1 554 460M707 454A81 81 0 0 1 861 478" fill="none" stroke="#627e66" stroke-width="5" />
                <path d="M399 476L403 488M858 476L861 488" fill="none" stroke="#e8bf82" stroke-width="4" />
                <path d="M450 401H520M456 401L467 416M514 401L523 419" fill="none" stroke="#5c7862" stroke-width="4" />
                <path d="M451 404L435 454M519 405L535 452" fill="none" stroke="#7e9272" stroke-width="2" />

                <g id="far-leg" fill="none" stroke="#bd8c48" stroke-width="7">
                  <path id="far-leg-path" d="M588 354L655 408L581 487" />
                </g>
                <g id="far-foot" transform="translate(581 487)">
                  <path d="M-10-5L5-8L12-3L23 0L21 5H-11L-15 0Z" fill="#c99144" stroke="#ad7d3d" stroke-width="1.5" />
                  <path d="M-13 7H14" stroke="#385951" stroke-width="4" />
                </g>

                <path d="M477 474L608 467A20 20 0 0 1 608 507L477 498A12 12 0 0 1 477 474Z" fill="#dbcca0" fill-opacity="0.25" stroke="#6f7e60" stroke-width="2.5" />
                <path d="M477 486L571 403L608 487ZM571 403L714 417L608 487M714 417L781 486" fill="none" stroke="#6d6f52" stroke-width="10" />
                <path d="M477 486L571 403L608 487ZM571 403L714 417L608 487M714 417L781 486" fill="none" stroke="#d98252" stroke-width="6.5" />
                <path d="M577 411L597 459M591 405L683 415" fill="none" stroke="#efb47c" stroke-width="2" />
                <path d="M571 403L563 376M714 417L704 390L724 367" fill="none" stroke="#566b54" stroke-width="6" />

          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 11C5 7 8 7 10 11C12 7 15 7 17 11M5 15H15" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" /></svg>
          生活没有进度条，骑开心就好。
        </span>

    <script>
      (() => {
        "use strict";

        const byId = (id) => document.getElementById(id);
        const parts = Object.fromEntries([
          "rear-wheel-spin", "front-wheel-spin", "crank", "pelican",
          "far-leg-path", "near-leg-path", "far-foot", "near-foot",
          "scarf-long", "scarf-short", "road-markings", "roadside",
          "foreground", "sea-ripples", "sailboat", "cloud-one",
          "cloud-two", "cloud-three", "gulls", "gull-one", "gull-two",
        ].map((id) => [id, byId(id)]));

        const toggle = byId("toggle-play");
        const toggleLabel = byId("toggle-label");
        const status = byId("ride-status");
        const speedValue = byId("speed-value");
        const speedButtons = [...document.querySelectorAll("[data-speed]")];
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
        const state = {
          time: 0,
          speed: 1,
          playing: !reducedMotion.matches,
          previousFrame: null,
          frame: null,
        };

        const degrees = 180 / Math.PI;
        const round = (value) => Math.round(value * 100) / 100;
        const transform = (id, value) => parts[id].setAttribute("transform", value);
        const translate = (x, y = 0) => `translate(${round(x)} ${round(y)})`;

        // Solve both leg segments so each webbed foot stays on its pedal.
        function poseLeg(pathId, footId, hipX, hipY, angle) {
          const footX = 608 + Math.cos(angle) * 27;
          const footY = 487 + Math.sin(angle) * 27;
          const dx = footX - hipX;
          const dy = footY - hipY;
          const distance = Math.hypot(dx, dy);
          const upper = 90;
          const lower = 93;
          const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
          const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
          const kneeX = hipX + dx * along / distance + dy * bend / distance;
          const kneeY = hipY + dy * along / distance - dx * bend / distance;
          parts[pathId].setAttribute(
            "d",
            `M${round(hipX)} ${round(hipY)}L${round(kneeX)} ${round(kneeY)}L${round(footX)} ${round(footY)}`,
          );
          transform(footId, `${translate(footX, footY)} rotate(${round(Math.cos(angle) * 5)})`);
        }

        function render(time) {
          const crankAngle = time * 4.2;
          const wheelAngle = time * 4.65 * degrees;
          const bob = Math.sin(crankAngle * 2) * 1.7;
          const flutter = Math.sin(time * 5.2);
          const flutterTwo = Math.sin(time * 5.2 - 1.3);

          transform("rear-wheel-spin", `${translate(477, 486)} rotate(${round(wheelAngle)})`);
          transform("front-wheel-spin", `${translate(781, 486)} rotate(${round(wheelAngle)})`);
          transform("crank", `${translate(608, 487)} rotate(${round(crankAngle * degrees)})`);
          transform("pelican", translate(0, bob));
          poseLeg("near-leg-path", "near-foot", 568, 351 + bob, crankAngle);
          poseLeg("far-leg-path", "far-foot", 588, 354 + bob, crankAngle + Math.PI);

          parts["scarf-long"].setAttribute(
            "d",
            `M647 265C616 261 605 ${round(242 + flutter * 5)} 578 ${round(250 + flutterTwo * 6)}Q560 ${round(257 + flutterTwo * 7)} 539 ${round(248 + flutter * 8)}L548 ${round(267 + flutter * 8)}Q571 ${round(275 + flutterTwo * 7)} 591 ${round(265 + flutterTwo * 5)}C612 ${round(258 + flutter * 4)} 625 282 646 280Z`,
          );
          parts["scarf-short"].setAttribute(
            "d",
            `M642 274Q606 ${round(282 + flutterTwo * 4)} 581 ${round(269 + flutter * 5)}L575 ${round(282 + flutter * 5)}Q607 ${round(300 + flutterTwo * 4)} 646 284Z`,
          );

          // One simulation clock keeps scenery, pedals, and wheels in step.
          transform("road-markings", translate(-((time * 348.75) % 320)));
          transform("roadside", translate(-((time * 285) % 1680)));
          transform("foreground", translate(-((time * 380) % 1680)));
          transform("sea-ripples", translate(-((time * 18) % 360)));
          transform("sailboat", translate(-((time * 6 + 1080) % 1480) + 1080, Math.sin(time * 1.3) * 1.8));
          transform("cloud-one", translate(((206 - time * 7 + 140) % 1560 + 1560) % 1560 - 140, 131));
          transform("cloud-two", `${translate(((548 - time * 4 + 140) % 1560 + 1560) % 1560 - 140, 91)} scale(.72)`);
          transform("cloud-three", `${translate(((1156 - time * 5 + 140) % 1560 + 1560) % 1560 - 140, 210)} scale(.9)`);
          transform("gulls", translate(Math.sin(time * 0.4) * 14, Math.sin(time * 1.1) * 3));

          const flap = Math.sin(time * 3.4) * 5;
          parts["gull-one"].setAttribute("d", `M817 ${round(138 - flap)}Q828 126 839 138Q850 125 861 ${round(137 - flap)}`);
          parts["gull-two"].setAttribute("d", `M867 ${round(170 + flap * 0.6)}Q874 162 881 170Q888 161 895 ${round(169 + flap * 0.6)}`);
        }

        function updateControls() {
          toggle.dataset.state = state.playing ? "playing" : "paused";
          toggle.setAttribute("aria-label", state.playing ? "暂停骑行动画" : "继续骑行动画");
          toggleLabel.textContent = state.playing ? "歇一会儿" : "继续出发";
          status.textContent = state.playing ? "正在吹海风" : "停下来，看看海";
          speedValue.textContent = state.playing ? String(Math.round(12 * state.speed)) : "0";
        }

        function tick(timestamp) {
          state.frame = null;
          if (!state.playing || document.hidden) return;
          if (state.previousFrame !== null) {
            state.time += Math.min((timestamp - state.previousFrame) / 1000, 0.06) * state.speed;
          }
          state.previousFrame = timestamp;
          render(state.time);
          state.frame = requestAnimationFrame(tick);
        }

        function syncPlayback() {
          if (state.frame !== null) cancelAnimationFrame(state.frame);
          state.frame = null;
          state.previousFrame = null;
          updateControls();
          if (state.playing && !document.hidden) state.frame = requestAnimationFrame(tick);
        }

        toggle.disabled = false;
        toggle.addEventListener("click", () => {
          state.playing = !state.playing;
          syncPlayback();
        });

        speedButtons.forEach((button) => {
          button.disabled = false;
          button.addEventListener("click", () => {
            state.speed = Number(button.dataset.speed);
            speedButtons.forEach((option) => {
              option.setAttribute("aria-pressed", String(option === button));
            });
            updateControls();
          });
        });

        document.addEventListener("visibilitychange", syncPlayback);
        reducedMotion.addEventListener("change", (event) => {
          if (event.matches) {
            state.playing = false;
            syncPlayback();
          }
        });

        render(0);
        syncPlayback();
      })();
    </script>
